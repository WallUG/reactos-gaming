[FREELOADER]
DefaultOS=LiveSMP_Debug
TimeOut=10

[Display]
TitleText=ReactOS Boot Media
MinimalUI=Yes

[Operating Systems]
Setup="ReactOS Setup (Text Mode)"
LiveImg="ReactOS Live Environment (Graphics Mode)"
LiveImg_RamDisk="ReactOS Live Environment - RamDisk"
==
;; The entries below are for testing and development:
Setup_Debug="Setup (Debug)"
Setup_Screen="Setup (Screen Debug)"
LiveImg_Debug="Live (Debug)"
LiveSMP_Debug="Live SMP (Debug)"
LiveSMP="Live SMP (no serial: no KDSERIAL freeze-storm, for hang-vs-print tests)"
LiveSMP_C="Live APIC-UP (halaacpi)"
LiveAPIC_Dbg="Live APIC-UP debug no-KDSERIAL (halaacpi)"
LiveSMP_noKDSERIAL="Live SMP debug no-KDSERIAL (halmacpi+ntkrnlmp)"
LiveImg_VBoxDebug="Live (VBox Debug)"
LiveImg_Screen="Live (Screen Debug)"
;; The following entry is an example template:
;LiveImg_LogFile="Live (Log file)"

[Setup]
BootType=ReactOSSetup

[Setup_Debug]
BootType=ReactOSSetup
Options=/DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /NOGUIBOOT /SIFOPTIONSOVERRIDE

[Setup_Screen]
BootType=ReactOSSetup
Options=/DEBUG /DEBUGPORT=SCREEN /SIFOPTIONSOVERRIDE

[LiveImg]
BootType=Windows2003
SystemPath=\reactos
Options=/FASTDETECT /MININT

[LiveImg_RamDisk]
BootType=Windows2003
SystemPath=ramdisk(0)\reactos
Options=/FASTDETECT /MININT /RDPATH= /RDEXPORTASCD
;Options=/FASTDETECT /MININT /RDPATH=liveimg.iso /RDEXPORTASCD

[LiveImg_Debug]
BootType=Windows2003
SystemPath=\reactos
Options=/DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /FASTDETECT /MININT

[LiveSMP_Debug]
BootType=Windows2003
SystemPath=\reactos
Options=/DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /FASTDETECT /MININT /NOGUIBOOT /KDSERIAL HAL=halmacpi.dll KERNEL=ntkrnlmp.exe

[LiveSMP]
BootType=Windows2003
SystemPath=\reactos
Options=/FASTDETECT /MININT /NOGUIBOOT HAL=halmacpi.dll KERNEL=ntkrnlmp.exe

[LiveSMP_C]
BootType=Windows2003
SystemPath=\reactos
Options=/DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /FASTDETECT /MININT /NOGUIBOOT /KDSERIAL HAL=halaacpi.dll KERNEL=ntoskrnl.exe

[LiveAPIC_Dbg]
BootType=Windows2003
SystemPath=\reactos
Options=/DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /FASTDETECT /MININT HAL=halaacpi.dll KERNEL=ntoskrnl.exe

[LiveSMP_noKDSERIAL]
BootType=Windows2003
SystemPath=\reactos
Options=/DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /FASTDETECT /MININT HAL=halmacpi.dll KERNEL=ntkrnlmp.exe

[LiveImg_VBoxDebug]
BootType=Windows2003
SystemPath=\reactos
Options=/DEBUG /DEBUGPORT=VBOX /SOS /FASTDETECT /MININT

[LiveImg_Screen]
BootType=Windows2003
SystemPath=\reactos
Options=/DEBUG /DEBUGPORT=SCREEN /SOS /FASTDETECT /MININT

;[LiveImg_LogFile]
;BootType=Windows2003
;SystemPath=\reactos
;Options=/DEBUG /DEBUGPORT=FILE:\Device\HarddiskX\PartitionY\debug.log /SOS /FASTDETECT /MININT
